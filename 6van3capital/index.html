<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>6van3 Capital</title>
  <meta name="description" content="6van3 Capital — investeren met visie en discipline." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <!-- Lettertypen -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d9b36b;
      --gold-dim: #b8862f;
      --ink: #0e1116;
      --paper: #f4f1ea;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--paper);
      background: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Hero met foto-achtergrond ===== */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;

      /* Vervang de URL hieronder door je eigen foto (assets/achtergrond.jpg).
         De donkere gradient erover houdt de tekst altijd leesbaar. */
      background:
        linear-gradient(180deg, rgba(8,10,14,.55) 0%, rgba(8,10,14,.35) 40%, rgba(8,10,14,.75) 100%),
        url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=80")
        center / cover no-repeat fixed;
    }

    /* ===== Menubalk linksboven, kleine letters ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      gap: 16px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      letter-spacing: .5px;
      color: var(--paper);
      text-decoration: none;
    }
    .brand-mini img { height: 28px; width: 28px; }

    nav.menu {
      display: flex;
      gap: 26px;
    }
    nav.menu a {
      color: rgba(244,241,234,.82);
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color .2s ease, border-color .2s ease;
    }
    nav.menu a:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    /* Hamburger voor mobiel */
    .menu-toggle {
      display: none;
      background: none;
      border: 0;
      color: var(--paper);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    /* ===== Logo + naam in het midden ===== */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .center img.logo {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,.4));
    }
    .center h1 {
      margin: 26px 0 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: clamp(40px, 8vw, 76px);
      letter-spacing: 2px;
      line-height: 1.05;
    }
    .center h1 .accent { color: var(--gold); }
    .center p.tagline {
      margin: 18px 0 0;
      font-weight: 300;
      font-size: clamp(14px, 2.4vw, 18px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(244,241,234,.75);
    }
    .rule {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 28px auto 0;
      opacity: .8;
    }

    footer.hero-foot {
      padding: 20px 32px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(244,241,234,.55);
    }

    /* ===== Mobiel ===== */
    @media (max-width: 720px) {
      .menu-toggle { display: block; }
      nav.menu {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        flex-direction: column;
        gap: 0;
        background: rgba(8,10,14,.96);
        padding: 8px 0;
        display: none;
      }
      nav.menu.open { display: flex; }
      nav.menu a {
        padding: 14px 32px;
        border-bottom: 1px solid rgba(255,255,255,.06);
      }
      .hero { background-attachment: scroll; }
    }
  </style>
</head>
<body>
  <div class="hero">

    <!-- Menubalk linksboven -->
    <header class="topbar">
      <a class="brand-mini" href="#">
        <img src="assets/logo.svg" alt="" />
        6van3 Capital
      </a>

      <button class="menu-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>

      <nav class="menu" id="mainmenu">
        <a href="#over">Over ons</a>
        <a href="#strategie">Strategie</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <!-- Midden: logo + naam -->
    <main class="center">
      <img class="logo" src="assets/logo.svg" alt="6van3 Capital logo" />
      <h1>6van3 <span class="accent">Capital</span></h1>
      <p class="tagline">Investeren met visie &amp; discipline</p>
      <div class="rule"></div>
    </main>

    <footer class="hero-foot">
      &copy; <span id="year"></span> 6van3 Capital &middot; www.6van3capital.nl
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const toggle = document.querySelector(".menu-toggle");
    const menu = document.getElementById("mainmenu");
    toggle.addEventListener("click", () => {
      const open = menu.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
  </script>
</body>
</html>
